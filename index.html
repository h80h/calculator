<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <div>
      <div id="logo-container">
        <a href="https://h80h.xyz" target="_blank">
          <img id="logo" src="https://h80h.xyz/hedi_s_dream_88x31.png" alt="h80h's 88x31 button">
        </a>
      </div>
      <div id="display">
        <div id="history"></div>
        <div id="real-time">0</div>
      </div>
    </div>
    <div id="outer-btns-container">
      <div class="btns-container">
        <button class="small-font-btn">AC</button>
        <button class="large-font-btn">±</button>
        <button class="small-font-btn">%</button>
        <button class="operator large-font-btn">÷</button>
      </div>
      <div class="btns-container">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator large-font-btn">×</button>
      </div>
      <div class="btns-container">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator large-font-btn">−</button>
      </div>
      <div class="btns-container">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator large-font-btn">+</button>
      </div>
      <div class="btns-container">
        <button>☘️</button>
        <button>0</button>
        <button>.</button>
        <button id="operate">=</button>
      </div>
    </div>
  </div>
</body>
</html>
