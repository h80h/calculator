<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <div>
      <div id="logo-container">
        <a href="https://h80h.xyz" target="_blank">
          <img id="logo" src="https://h80h.xyz/hedi_s_dream_88x31.png" alt="h80h's 88x31 button">
        </a>
      </div>
      <div id="display">
        <div id="history">
          <div class="num-two"></div>
          <div class="operator"></div>
          <div class="num-one"></div>
        </div>
        <div id="real-time">
          <div class="num-two hidden"></div>
          <div class="operator hidden"></div>
          <div class="num-one">0</div>
        </div>
      </div>
    </div>
    <div id="outer-btns-container">
      <div>
        <div class="btns-container">
          <button id="all-clear">AC</button>
          <button id="negation">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
              <path d="M0 0h24v24H0z" fill="none" />
              <path fill="currentColor" d="M12 7.998H8v4H6v-4H2v-2h4v-4h2v4h4zm10 10h-8v-2h8zM18.5 4L4 18.5L5.5 20L20 5.5z" />
            </svg>
          </button>
          <button id="percent">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
              <path d="M0 0h24v24H0z" fill="none" />
              <path fill="currentColor"
                d="M7.5 11C9.43 11 11 9.43 11 7.5S9.43 4 7.5 4S4 5.57 4 7.5S5.57 11 7.5 11m0-5C8.33 6 9 6.67 9 7.5S8.33 9 7.5 9S6 8.33 6 7.5S6.67 6 7.5 6M4.002 18.583L18.59 3.996l1.414 1.414L5.417 19.997zM16.5 13c-1.93 0-3.5 1.57-3.5 3.5s1.57 3.5 3.5 3.5s3.5-1.57 3.5-3.5s-1.57-3.5-3.5-3.5m0 5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5s1.5.67 1.5 1.5s-.67 1.5-1.5 1.5" />
            </svg>
          </button>
        </div>
        <div class="btns-container">
          <button>7</button>
          <button>8</button>
          <button>9</button>
        </div>
        <div class="btns-container">
          <button>4</button>
          <button>5</button>
          <button>6</button>
        </div>
        <div class="btns-container">
          <button>1</button>
          <button>2</button>
          <button>3</button>
        </div>
        <div class="btns-container">
          <button>☘️</button>
          <button>0</button>
          <button>.</button>
        </div>
      </div>
      <div id="operators-container">
        <button class="operator" id="÷">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor"
              d="M5 11h14v2H5zm7-3a1.5 1.5 0 1 1 0-3a1.5 1.5 0 0 1 0 3m0 11a1.5 1.5 0 1 1 0-3a1.5 1.5 0 0 1 0 3" />
          </svg>
        </button>
        <button class="operator" id="×">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor"
              d="m12 10.587l4.95-4.95l1.414 1.414l-4.95 4.95l4.95 4.95l-1.415 1.414l-4.95-4.95l-4.949 4.95l-1.414-1.415l4.95-4.95l-4.95-4.95L7.05 5.638z" />
          </svg>
        </button>
        <button class="operator" id="-">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M5 11v2h14v-2z" />
          </svg>
        </button>
        <button class="operator" id="+">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z" />
          </svg>
        </button>
        <button id="operate">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M19 8H5v2h14zm0 6H5v2h14z" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
